<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#00574f">
    <title>Offline | Mountain Ceramics Company</title>
    <style>
      :root {
        color-scheme: light;
        --background: #fffcf5;
        --foreground: #1a2b27;
        --primary: #00574f;
        --primary-foreground: #ffffff;
        --accent: #d6b43e;
        --muted: #f6f0e0;
        --muted-foreground: #505d57;
        --border: #8f8978;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
      }

      main {
        width: min(100%, 34rem);
        padding: clamp(2rem, 8vw, 4rem);
        border: 1px solid var(--border);
        border-top: 5px solid var(--accent);
        background: #fff;
        text-align: center;
      }

      .wordmark {
        margin: 0;
        color: var(--primary);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.45rem, 5vw, 2rem);
        font-weight: 600;
        letter-spacing: -0.035em;
      }

      .rule {
        width: 3rem;
        height: 2px;
        margin: 1.5rem auto;
        background: var(--accent);
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 8vw, 3rem);
        font-weight: 500;
        line-height: 1.05;
      }

      p {
        max-width: 27rem;
        margin: 1rem auto 1.75rem;
        color: var(--muted-foreground);
        font-size: 0.95rem;
        line-height: 1.7;
      }

      button {
        min-height: 2.75rem;
        padding: 0.75rem 1.25rem;
        border: 0;
        background: var(--primary);
        color: var(--primary-foreground);
        cursor: pointer;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 700;
      }

      button:hover { background: #123a34; }
      button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

      @media (prefers-reduced-motion: no-preference) {
        button { transition: background-color 160ms ease; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="wordmark">Mountain Ceramics Company</p>
      <div class="rule" aria-hidden="true"></div>
      <h1>You’re offline</h1>
      <p>
        This page isn’t available without an internet connection. Reconnect and
        try again to continue exploring our tile collections.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
